name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: questline
          POSTGRES_PASSWORD: questline
          POSTGRES_DB: questline_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U questline -d questline_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://questline:questline@localhost:5432/questline_test
      JWT_SECRET: ci-test-jwt-secret-not-for-prod
      NODE_VERSION: '22'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
