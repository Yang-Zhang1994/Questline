openapi: 3.0.3
info:
  title: Questline API
  version: 0.1.0
  description: |
    HTTP API for **Questline** (Mochi's Quest Diary).

    Vocabulary: **Goal → Milestone → Quest**. One **active** Goal drives Today / Map / Talk.
    Mochi proposals use confirm-before-save (draft JSONB → explicit confirm writes rows).

    Auth: JWT Bearer on all routes except `/api/health` and `/api/auth/*`.
    Errors: `{ "error": { "code": string, "message": string } }`.
  contact:
    name: Questline
servers:
  - url: http://localhost:3001
    description: Local API (`npm run dev:server`)
  - url: http://localhost:5173
    description: Vite dev proxy (`/api` → :3001)

tags:
  - name: Health
  - name: Auth
  - name: Goals
  - name: Milestones
  - name: Quests
  - name: Progress
    description: XP / level / streak / stamp card are returned on quest Today + completion responses (no separate progress resource).
  - name: Chat
  - name: Diary

paths:
  /api/health:
    get:
      tags: [Health]
      summary: Liveness check
      operationId: getHealth
      security: []
      responses:
        '200':
          description: API is up
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
                    example: true

  /api/auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterBody'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/ConflictError'

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Log in
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginBody'
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/goals:
    get:
      tags: [Goals]
      summary: List selectable goals + active goal id
      operationId: listGoals
      responses:
        '200':
          description: Goals for the authenticated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoalsListResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/goals/new:
    post:
      tags: [Goals]
      summary: Pause active goal and restart Mochi interview
      description: Starts a fresh interview without deleting other goals (#18).
      operationId: startNewGoal
      responses:
        '201':
          description: Interview restarted; previous active goal paused if any
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartNewGoalResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/goals/manual-plan:
    post:
      tags: [Goals]
      summary: Create goal + milestones without chat
      description: Manual plan form fallback (#21). Submit is the confirm-before-save step.
      operationId: createManualPlan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManualPlanBody'
      responses:
        '201':
          description: Goal and milestones created; becomes active
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManualPlanResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/goals/{id}/activate:
    patch:
      tags: [Goals]
      summary: Switch the active goal
      operationId: activateGoal
      parameters:
        - $ref: '#/components/parameters/GoalId'
      responses:
        '200':
          description: Activated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivateGoalResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/goals/{id}:
    delete:
      tags: [Goals]
      summary: Delete a goal (cascades milestones + quests)
      operationId: deleteGoal
      parameters:
        - $ref: '#/components/parameters/GoalId'
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteGoalResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/milestones/draft:
    get:
      tags: [Milestones]
      summary: Load milestone draft / confirmed plan for active goal
      operationId: getMilestoneDraft
      responses:
        '200':
          description: Plan snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MilestonePlanResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    post:
      tags: [Milestones]
      summary: Propose a 3–7 milestone draft (no row writes)
      operationId: proposeMilestoneDraft
      responses:
        '200':
          description: Existing draft / already confirmed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MilestonePlanResponse'
        '201':
          description: New draft stored on `goals.milestone_draft`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MilestonePlanResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '503':
          $ref: '#/components/responses/AiUnavailableError'

  /api/milestones/draft/revise:
    post:
      tags: [Milestones]
      summary: Revise milestone draft with feedback
      operationId: reviseMilestoneDraft
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackBody'
      responses:
        '200':
          description: Updated draft
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MilestonePlanResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '503':
          $ref: '#/components/responses/AiUnavailableError'

  /api/milestones/confirm:
    post:
      tags: [Milestones]
      summary: Confirm draft — INSERTs `milestones` rows
      operationId: confirmMilestonePlan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmMilestonePlanBody'
      responses:
        '201':
          description: Milestones persisted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfirmMilestonePlanResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/milestones/{milestoneId}/complete:
    post:
      tags: [Milestones]
      summary: Mark current stage complete and advance roadmap
      operationId: completeMilestoneStage
      parameters:
        - $ref: '#/components/parameters/MilestoneId'
      responses:
        '200':
          description: Stage cleared
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompleteStageResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/quests/today:
    get:
      tags: [Quests, Progress]
      summary: Today's quests + progress HUD for the active goal
      description: |
        Returns greeting, today's / overdue quests, XP/level/streak (`progress`),
        stamp card, and stage-ready flags.
      operationId: getTodayQuests
      parameters:
        - $ref: '#/components/parameters/LocalDateQuery'
      responses:
        '200':
          description: Today payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodayQuestsResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/quests:
    get:
      tags: [Quests]
      summary: List quests for one milestone (Map sheet)
      operationId: listMilestoneQuests
      parameters:
        - name: milestone_id
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Milestone + quests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MilestoneQuestsResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    post:
      tags: [Quests]
      summary: Manually create a quest (immediate write)
      operationId: createQuest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateQuestBody'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateQuestResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/quests/draft:
    get:
      tags: [Quests]
      summary: Load quest draft for the current milestone
      operationId: getQuestDraft
      responses:
        '200':
          description: Plan snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestPlanResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    post:
      tags: [Quests]
      summary: Propose quest draft (no row writes)
      operationId: proposeQuestDraft
      responses:
        '200':
          description: Existing draft / already confirmed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestPlanResponse'
        '201':
          description: New draft stored on `milestones.quest_draft`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestPlanResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '503':
          $ref: '#/components/responses/AiUnavailableError'

  /api/quests/draft/revise:
    post:
      tags: [Quests]
      summary: Revise quest draft with feedback
      operationId: reviseQuestDraft
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackBody'
      responses:
        '200':
          description: Updated draft
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestPlanResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '503':
          $ref: '#/components/responses/AiUnavailableError'

  /api/quests/confirm:
    post:
      tags: [Quests]
      summary: Confirm quest draft — INSERTs `quests` rows
      operationId: confirmQuestPlan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmQuestPlanBody'
      responses:
        '201':
          description: Quests persisted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfirmQuestPlanResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/quests/reschedule:
    get:
      tags: [Quests]
      summary: Load reschedule draft + overdue list
      operationId: getReschedulePlan
      parameters:
        - $ref: '#/components/parameters/LocalDateQuery'
      responses:
        '200':
          description: Reschedule snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RescheduleResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    post:
      tags: [Quests]
      summary: Propose reschedule draft (no due_date writes)
      operationId: proposeReschedule
      parameters:
        - $ref: '#/components/parameters/LocalDateQuery'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                local_date:
                  $ref: '#/components/schemas/IsoDate'
      responses:
        '200':
          description: No new draft needed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RescheduleResponse'
        '201':
          description: Draft stored on `goals.reschedule_draft`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RescheduleResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '503':
          $ref: '#/components/responses/AiUnavailableError'

  /api/quests/reschedule/revise:
    post:
      tags: [Quests]
      summary: Revise reschedule draft
      operationId: reviseReschedule
      requestBody:
        required: false
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/FeedbackBody'
                - type: object
                  properties:
                    local_date:
                      $ref: '#/components/schemas/IsoDate'
      responses:
        '200':
          description: Updated draft
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RescheduleResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '503':
          $ref: '#/components/responses/AiUnavailableError'

  /api/quests/reschedule/confirm:
    post:
      tags: [Quests]
      summary: Confirm reschedule — UPDATEs quest due_dates
      operationId: confirmReschedule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/ConfirmRescheduleBody'
                - type: object
                  properties:
                    local_date:
                      $ref: '#/components/schemas/IsoDate'
      responses:
        '201':
          description: Due dates applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfirmRescheduleResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/quests/week-plan:
    get:
      tags: [Quests]
      summary: Load week-plan draft + existing milestone quests
      operationId: getWeekPlan
      parameters:
        - $ref: '#/components/parameters/LocalDateQuery'
      responses:
        '200':
          description: Week plan snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeekPlanResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    post:
      tags: [Quests]
      summary: Propose week-plan draft (no INSERT)
      operationId: proposeWeekPlan
      parameters:
        - $ref: '#/components/parameters/LocalDateQuery'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                local_date:
                  $ref: '#/components/schemas/IsoDate'
      responses:
        '200':
          description: No new draft needed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeekPlanResponse'
        '201':
          description: Draft stored on `goals.week_plan_draft`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeekPlanResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '503':
          $ref: '#/components/responses/AiUnavailableError'

  /api/quests/week-plan/revise:
    post:
      tags: [Quests]
      summary: Revise week-plan draft
      operationId: reviseWeekPlan
      requestBody:
        required: false
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/FeedbackBody'
                - type: object
                  properties:
                    local_date:
                      $ref: '#/components/schemas/IsoDate'
      responses:
        '200':
          description: Updated draft
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeekPlanResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '503':
          $ref: '#/components/responses/AiUnavailableError'

  /api/quests/week-plan/confirm:
    post:
      tags: [Quests]
      summary: Confirm week plan — INSERTs new quest rows
      operationId: confirmWeekPlan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/ConfirmWeekPlanBody'
                - type: object
                  properties:
                    local_date:
                      $ref: '#/components/schemas/IsoDate'
      responses:
        '201':
          description: New quests inserted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfirmWeekPlanResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/quests/{questId}/completion:
    patch:
      tags: [Quests, Progress]
      summary: Toggle quest completion (awards / reverses XP, streak, stamps)
      operationId: toggleQuestCompletion
      parameters:
        - $ref: '#/components/parameters/QuestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ToggleQuestCompletionBody'
      responses:
        '200':
          description: Updated quest + progress HUD
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToggleQuestCompletionResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/quests/{questId}:
    delete:
      tags: [Quests, Progress]
      summary: Delete a quest (reverses XP if completed)
      operationId: deleteQuest
      parameters:
        - $ref: '#/components/parameters/QuestId'
        - $ref: '#/components/parameters/LocalDateQuery'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteQuestBody'
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteQuestResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/chat/messages:
    get:
      tags: [Chat]
      summary: Chat history + interview state
      operationId: listChatMessages
      responses:
        '200':
          description: Messages and interview progress
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatHistoryResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    post:
      tags: [Chat]
      summary: Send one user message (one interview topic at a time)
      operationId: sendChatMessage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendChatMessageBody'
      responses:
        '201':
          description: User + Mochi turns persisted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendChatMessageResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '503':
          $ref: '#/components/responses/AiUnavailableError'

  /api/chat/interview/restart:
    post:
      tags: [Chat]
      summary: Restart goal interview from the beginning
      operationId: restartInterview
      responses:
        '200':
          description: Cleared history + re-seeded welcome
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatHistoryResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/diary-notes:
    get:
      tags: [Diary]
      summary: Today's diary note for the active goal
      operationId: getDiaryNote
      parameters:
        - $ref: '#/components/parameters/LocalDateQuery'
      responses:
        '200':
          description: Note (empty content when none yet)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiaryNote'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    put:
      tags: [Diary]
      summary: Upsert today's diary note (autosave)
      operationId: upsertDiaryNote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertDiaryNoteBody'
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiaryNote'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "JWT from /api/auth/login or /api/auth/register. Send as Authorization: Bearer <token>."

  parameters:
    GoalId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    MilestoneId:
      name: milestoneId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    QuestId:
      name: questId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    LocalDateQuery:
      name: local_date
      in: query
      required: false
      description: Client local calendar date `YYYY-MM-DD` (streaks / stamps / overdue).
      schema:
        $ref: '#/components/schemas/IsoDate'

  responses:
    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    UnauthorizedError:
      description: Missing or invalid JWT
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    NotFoundError:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    ConflictError:
      description: Conflict (e.g. email already registered)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    AiUnavailableError:
      description: Claude / Mochi unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'

  schemas:
    IsoDate:
      type: string
      pattern: '^\d{4}-\d{2}-\d{2}$'
      example: '2026-11-10'
    IsoDateTime:
      type: string
      format: date-time
      example: '2026-11-10T15:04:05.000Z'

    ErrorBody:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - VALIDATION_ERROR
                - NOT_FOUND
                - UNAUTHORIZED
                - CONFLICT
                - AI_UNAVAILABLE
                - INTERNAL_ERROR
            message:
              type: string

    RegisterBody:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 8
          maxLength: 128

    LoginBody:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
          maxLength: 128

    PublicUser:
      type: object
      required: [id, email]
      properties:
        id:
          type: integer
          minimum: 1
        email:
          type: string
          format: email

    AuthResponse:
      type: object
      required: [user, token]
      properties:
        user:
          $ref: '#/components/schemas/PublicUser'
        token:
          type: string
          minLength: 1

    GoalStatus:
      type: string
      enum: [active, paused, completed, archived]

    Goal:
      type: object
      required:
